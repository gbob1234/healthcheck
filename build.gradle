plugins {
    id 'java'
    id 'application'
}

group = 'com.kafka.producer'
version = '1.1-SNAPSHOT'

repositories { mavenCentral() }

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

ext {
    kafkaVersion = '3.9.2'
    cloudEventsVersion = '2.5.0'
    jacksonVersion = '2.17.2'
}

dependencies {
    implementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
    implementation "io.cloudevents:cloudevents-core:${cloudEventsVersion}"
    implementation "io.cloudevents:cloudevents-json-jackson:${cloudEventsVersion}"
    implementation "io.cloudevents:cloudevents-kafka:${cloudEventsVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation 'org.slf4j:slf4j-api:1.7.36'
    runtimeOnly 'ch.qos.logback:logback-classic:1.2.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'com.kafka.producer.ApplicationMain'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-options']
}

test { useJUnitPlatform() }

jar {
    archiveBaseName.set('IMAGE_PRODUCER')
    manifest { attributes('Main-Class': application.mainClass.get()) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
