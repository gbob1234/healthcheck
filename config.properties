# Application
application.name=file-collector
application.version=2.0-SNAPSHOT
application.fatal.exit.code=20

# Daily file watcher. The equipment PC's local date resolves the yyyyMMdd directory.
file.watch.root.directory=D:/Original
file.watch.date.directory.pattern=yyyyMMdd
file.archive.directory.name=old
file.allowed.extensions=jpg,jpeg,png,csv
file.stability.check.interval.ms=500
file.stability.required.count=2
file.stability.timeout.ms=30000
file.processing.thread.count=1
file.max.file.size.bytes=1099511627776
file.processing.max.attempts=3
file.processing.retry.backoff.ms=5000

# S3 destination. Credentials may be omitted to use the AWS default credentials provider chain.
s3.endpoint=https://dell-s3.example.internal
s3.region=ap-northeast-2
s3.bucket=equipment-collection
s3.object.key.prefix=production/equipment
s3.path.style.access.enabled=true
# Keep HTTPS encryption but disable certificate-chain/hostname verification for the internal endpoint.
s3.tls.verify=false
s3.access.key=
s3.secret.key=
s3.session.token=
s3.multipart.threshold.bytes=67108864
s3.multipart.part.size.bytes=134217728

# Kafka common
kafka.bootstrap.servers=broker1:9092,broker2:9092
kafka.security.mode=PLAINTEXT

# Device identity
device.id=DEVICE-001
device.name=DEVICE-001

# SSL (all store settings are optional; JVM/environment defaults are used when omitted)
kafka.ssl.truststore.location=
kafka.ssl.truststore.password=
kafka.ssl.keystore.location=
kafka.ssl.keystore.password=
kafka.ssl.key.password=
kafka.ssl.endpoint.identification.algorithm=https

# SASL_SSL (a non-empty direct JAAS value takes precedence over username/password)
kafka.sasl.mechanism=SCRAM-SHA-512
kafka.sasl.username=
kafka.sasl.password=
kafka.sasl.jaas.config=

# File metadata producer
file.kafka.topic=collected-file-metadata
file.kafka.acks=all
file.kafka.retries=3
file.kafka.request.timeout.ms=30000
file.kafka.delivery.timeout.ms=120000
file.kafka.max.block.ms=60000

# Health check
health.enabled=true
health.required=true
health.topic=device-health
health.interval.seconds=60
health.initial.delay.seconds=10
health.worker.stale.threshold.seconds=180
health.init.max.attempts=3
health.init.retry.backoff.ms=5000
health.send.max.consecutive.failures=5
health.send.max.failure.duration.seconds=300
health.recovery.enabled=true
health.recovery.max.attempts=2
health.recovery.retry.backoff.ms=5000
health.shutdown.timeout.seconds=5
health.fatal.exit.code=20
health.kafka.acks=1
health.kafka.retries=1
health.kafka.linger.ms=0
health.kafka.max.block.ms=3000
health.kafka.request.timeout.ms=5000
health.kafka.delivery.timeout.ms=10000
health.kafka.buffer.memory=1048576

# CloudEvents identity
health.system.id=EQUIPMENT_FILE_COLLECTOR
health.source.type=WINDOWS_PC
health.program.name=file-collector
health.program.version=2.0-SNAPSHOT
health.event.type=com.company.health.status.v1
health.event.dataschema=urn:company:schema:health-status:1.0
