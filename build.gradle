def coursierCachePath = providers.gradleProperty('coursierCachePath')
        .orElse(providers.environmentVariable('COURSIER_CACHE_PATH'))

allprojects {
    group = 'com.kafka.producer'
    version = '2.0-SNAPSHOT'

    repositories {
        mavenLocal()
        if (coursierCachePath.isPresent()) {
            maven {
                name = 'coursierCache'
                url = uri(coursierCachePath.get())
                metadataSources {
                    mavenPom()
                    artifact()
                }
            }
        }
        mavenCentral()
    }
}

ext {
    junitJupiterVersion = '5.10.1'
}

subprojects {
    apply plugin: 'java'

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Xlint:-options']
    }

    test {
        useJUnitPlatform()
    }
}
