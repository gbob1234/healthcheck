# Application
application.name=image-producer
application.version=1.1-SNAPSHOT
application.fatal.exit.code=20

# Image watcher
image.watch.directory=C:/equipment/images
image.allowed.extensions=jpg,jpeg,png,bmp
image.file.stability.check.interval.ms=500
image.file.stability.required.count=2
image.file.stability.timeout.ms=10000
image.processing.thread.count=2
image.max.file.size.bytes=52428800

# Kafka common
kafka.bootstrap.servers=broker1:9092,broker2:9092
kafka.security.mode=PLAINTEXT

# SSL (required only in SSL/SASL_SSL mode)
kafka.ssl.truststore.location=
kafka.ssl.truststore.password=
kafka.ssl.keystore.location=
kafka.ssl.keystore.password=
kafka.ssl.key.password=
kafka.ssl.endpoint.identification.algorithm=https

# SASL_SSL (a non-empty direct JAAS value takes precedence over username/password)
kafka.sasl.mechanism=SCRAM-SHA-512
kafka.sasl.username=
kafka.sasl.password=
kafka.sasl.jaas.config=

# Image producer
image.kafka.topic=image-input
image.kafka.client.id=DEVICE-001-image
image.kafka.acks=all
image.kafka.retries=3
image.kafka.request.timeout.ms=30000
image.kafka.delivery.timeout.ms=120000
image.kafka.max.block.ms=60000

# Health check
health.enabled=true
health.required=true
health.topic=device-health
health.kafka.client.id=DEVICE-001-health
health.interval.seconds=60
health.initial.delay.seconds=10
health.worker.stale.threshold.seconds=180
health.init.max.attempts=3
health.init.retry.backoff.ms=5000
health.send.max.consecutive.failures=5
health.send.max.failure.duration.seconds=300
health.recovery.enabled=true
health.recovery.max.attempts=2
health.recovery.retry.backoff.ms=5000
health.shutdown.timeout.seconds=5
health.fatal.exit.code=20
health.kafka.acks=1
health.kafka.retries=1
health.kafka.linger.ms=0
health.kafka.max.block.ms=3000
health.kafka.request.timeout.ms=5000
health.kafka.delivery.timeout.ms=10000
health.kafka.buffer.memory=1048576

# CloudEvents identity
health.device.id=DEVICE-001
health.system.id=EQUIPMENT_IMAGE_SENDER
health.source.type=WINDOWS_PC
health.program.name=image-producer
health.program.version=1.1-SNAPSHOT
health.event.type=com.company.health.status.v1
health.event.source=/systems/EQUIPMENT_IMAGE_SENDER/devices/DEVICE-001/programs/image-producer
health.event.dataschema=urn:company:schema:health-status:1.0
